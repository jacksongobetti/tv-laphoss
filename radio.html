<script>
/* Rádio Laphóss
   A apresentação roda dentro do quadro (iframe) e se atualiza sozinha.
   Este arquivo só cuida do som: músicas embaralhadas com transição suave,

(function(){
  var frame = document.getElementById('tela');
  var porta = document.getElementById('porta');
  var aviso = document.getElementById('aviso');

  var cfg = null, ligado = false;

  var fila = [], filaSpots = [], desdeSpot = 0, falhas = 0;
  A.concat([voz]).forEach(function(a){ a.preload = 'auto'; });

  function log(){ try { console.log.apply(console, ['[radio]'].concat([].slice.call(arguments))); } catch(e){} }
  function num(v, d){ v = parseFloat(v); return isNaN(v) ? d : v; }
  function VOL(){ return num(cfg.volume, .85); }
  function FUNDO(){ return num(cfg.volumeFundo, .18); }
  function XF(){ return num(cfg.crossfade, 3); }

  /* volume subindo ou descendo aos poucos */
  function ramp(a, to, ms, done){
    clearInterval(a._iv);
    var from = a.volume, t0 = Date.now();
    if (!ms || ms <= 0){ a.volume = Math.max(0, Math.min(1, to)); if (done) done(); return; }
    a._iv = setInterval(function(){
      var k = Math.min(1, (Date.now() - t0) / ms);
      a.volume = Math.max(0, Math.min(1, from + (to - from) * k));
      if (k >= 1){ clearInterval(a._iv); if (done) done(); }
    }, 40);
  }
  function embaralha(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  /* embaralha sem repetir a última faixa logo em seguida */
  var ultMusica = null, ultSpot = null;
  function proxMusica(){
    if (!fila.length){ fila = embaralha(cfg.musicas); if (fila.length > 1 && fila[0] === ultMusica) fila.push(fila.shift()); }
    return (ultMusica = fila.shift());
  }
  function proxSpot(){
    if (!filaSpots.length){ filaSpots = embaralha(cfg.anuncios); if (filaSpots.length > 1 && filaSpots[0] === ultSpot) filaSpots.push(filaSpots.shift()); }
    return (ultSpot = filaSpots.shift());
  }

  function tocar(a, url, vol, subirEm){
    a._fim = false; a._url = url;
    a.src = url; a.volume = vol;
    log('música', url);
    var p = a.play();
    if (p && p.catch) p.catch(function(err){
      if (err && err.name === 'NotAllowedError') pedirOK();
    });
    if (subirEm) ramp(a, VOL(), subirEm);
  }

  /* fim de cada música: transição normal ou intervalo com anúncio */
  A.forEach(function(a, i){
    a.addEventListener('playing', function(){ falhas = 0; });
    a.addEventListener('timeupdate', function(){
      if (i !== cur || a._fim || !ligado || !a.duration || isNaN(a.duration)) return;
      if (a.duration - a.currentTime <= XF()){ a._fim = true; fimDaMusica(); }
    });
    a.addEventListener('ended', function(){
      if (i === cur && !a._fim && ligado){ a._fim = true; fimDaMusica(); }
    });
    a.addEventListener('error', function(){
      if (i !== cur || !ligado || a._fim) return;
      a._fim = true; falhas++;
      log('não carregou', a._url);
      var espera = Math.min(30000, 1500 * Math.pow(2, Math.min(falhas, 5)));
      setTimeout(function(){ if (ligado) seguir(true); }, espera);
    });
  });

  function fimDaMusica(){
    var velha = A[cur];
    desdeSpot++;
    if (cfg.anuncios.length && desdeSpot >= Math.max(1, num(cfg.anuncioACada, 3))){
      desdeSpot = 0; intervalo(velha);
    } else {
      ramp(velha, 0, XF() * 1000, function(){ velha.pause(); });
      seguir(false);
    }
  }
  function seguir(direto){
    cur = 1 - cur;
    tocar(A[cur], proxMusica(), 0, direto ? 1200 : XF() * 1000);
  }

  function intervalo(velha){
    ramp(velha, 0, XF() * 1000, function(){ velha.pause(); });
    var lista = [];
    if (cfg.vinhetas.length && Math.random() < .6) lista.push(cfg.vinhetas[Math.floor(Math.random() * cfg.vinhetas.length)]);
    lista.push(proxSpot());
    setTimeout(function(){
      if (!ligado) return;
      cur = 1 - cur;
      tocar(A[cur], proxMusica(), 0, 0);
      ramp(A[cur], FUNDO(), 1500);
      falar(lista, function(){ ramp(A[cur], VOL(), 2500); });
    }, XF() * 600);
  }

  function falar(lista, fim){
    if (!lista.length || !ligado){ fim(); return; }
    var url = lista.shift();
    log('voz', url);
    voz.onended = function(){ falar(lista, fim); };
    voz.onerror = function(){ falar(lista, fim); };
    voz.src = url; voz.volume = 1;
    var p = voz.play();
    if (p && p.catch) p.catch(function(){ falar(lista, fim); });
  }

  /* avisa a apresentação para mostrar o selo "Rádio Laphóss" no rodapé */
  function avisarTela(){
    try { frame.contentWindow.postMessage({ laphossRadio: ligado }, location.origin); } catch(e){}
  }
  frame.addEventListener('load', function(){ setTimeout(avisarTela, 500); });

  function pedirOK(){
    ligado = false;
    A.concat([voz]).forEach(function(a){ try { a.pause(); } catch(e){} });
    porta.hidden = false; aviso.hidden = false;
    avisarTela();
    try { window.focus(); } catch(e){}
  }

  function ligar(){
    if (ligado || !cfg) return;
    ligado = true; porta.hidden = true; aviso.hidden = true;
    var primeira = proxMusica();
    if (cfg.vinhetas.length){
      tocar(A[cur], primeira, 0, 0);
      ramp(A[cur], FUNDO(), 1000);
      falar([cfg.vinhetas[0]], function(){ ramp(A[cur], VOL(), 2500); });
    } else {
      tocar(A[cur], primeira, 0, 2500);
    }
    avisarTela();
  }

  function telaCheia(){
    var el = document.documentElement, r = el.requestFullscreen || el.webkitRequestFullscreen;
    if (document.fullscreenElement || document.webkitFullscreenElement || !r) return;
    try { var p = r.call(el); if (p && p.catch) p.catch(function(){}); } catch(e){}
  }

  /* o OK do controle (ou um clique) liga a rádio e põe em tela cheia */
  porta.addEventListener('click', function(){ telaCheia(); ligar(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.keyCode === 13){ telaCheia(); if (!ligado) ligar(); }
  });

  function carregar(primeiraVez){
    if (!window.fetch) return;
    fetch(PLAYLIST + '?v=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if (!j) return;
        j.musicas = j.musicas || []; j.anuncios = j.anuncios || []; j.vinhetas = j.vinhetas || [];
        var novo = !cfg;
        cfg = j;
        /* sem músicas cadastradas: funciona só como a apresentação */
        if (!cfg.musicas.length) return;
        if (novo && primeiraVez) ligar();   /* tenta tocar sozinha; se a TV bloquear, aparece o aviso do OK */
      })
      .catch(function(){});
  }
  carregar(true);
  setInterval(function(){ carregar(false); }, 10 * 60 * 1000);   /* músicas e anúncios novos entram sozinhos na fila */

  /* recarga diária às 6h, com a clínica fechada */
  (function diaria(){
    var n = new Date(), prox = new Date(n.getFullYear(), n.getMonth(), n.getDate(), 6, 0, 0);
    if (prox <= n) prox.setDate(prox.getDate() + 1);
    setTimeout(function(){ location.reload(); }, prox - n);
  })();
})();
</script>
</body>
